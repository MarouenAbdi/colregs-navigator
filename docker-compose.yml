services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: colregs
      POSTGRES_PASSWORD: colregs
      POSTGRES_DB: colregs_navigator
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U colregs"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
